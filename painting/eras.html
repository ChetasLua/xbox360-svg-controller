const SW = 962, SH = 828;                  // stroke space
const PW = 800, PH = 689;                  // panel size
const K = PW / SW;

// ------------------------------------------------------------------ utilities
let seed = 20260;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const clamp = (v, a = 0, b = 255) => (v < a ? a : v > b ? b : v);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function canvas(w = PW, h = PH) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const P = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
function vnoise(x, y) {                   // value noise in [0,1]
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const h = (a, b) => P[(P[a & 255] + b) & 255] / 255;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

function boxBlur(src, w, h, r) {           // Float32 channel, 2 passes

// 15 low poly: the mesh assembles, triangle by triangle, from the middle out

// 16 stencil: zig-zag passes of the can over the cut stencil, drips run last
function stencilP(S) {

  const T = tfield((xx, y, i) => (td[i] > 0 ? td[i] : sprayT(xx, y)));
  const tag = canvas(), gx = tag.getContext('2d'); gx.fillStyle = '#c8282a'; gx.font = 'bold 34px "DejaVu Sans Mono", monospace'; gx.textAlign = 'right'; gx.fillText('STUDY', PW - 40, PH - 40);

}

// 17 oil: blocked in with the big knife, refined, then the finishing marks

  const base = canvas(); { const b = base.getContext('2d'); b.fillStyle = 'rgb(132,99,96)'; b.fillRect(0, 0, PW, PH); }
  const sets = [s => s.r >= 16, s => s.r >= 8, () => true], windows = [[0.03, 0.34], [0.34, 0.62], [0.62, 0.9]];
  const idxT = new Map(); let counts = [0, 0, 0];
  STROKE_LIST.forEach(s => { const k = s.r >= 16 ? 0 : s.r >= 8 ? 1 : 2; counts[k]++; });
  const seen = [0, 0, 0];
  STROKE_LIST.forEach(s => { const k = s.r >= 16 ? 0 : s.r >= 8 ? 1 : 2, [a, b] = windows[k]; idxT.set(s, a + (b - a) * (seen[k]++ / counts[k])); });

    const img = canvas(), x = img.getContext('2d'), [tc, tx] = timeCanvas();

}

    const ex = PX + edgeX, sh = g.createLinearGradient(ex, 0, ex + 40, 0); sh.addColorStop(0, 'rgba(0,0,0,0.3)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh; g.fillRect(ex, PY, Math.min(40, PX + PW - ex), PH); g.fillStyle = 'rgba(255,248,235,0.95)'; g.fillRect(ex - 1.5, PY, 3, PH);
  }
  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1; g.strokeRect(PX - 0.5, PY - 0.5, PW + 1, PH + 1);
}
function drawLeft(t) {
  const a = ease((t - 0.1) / 0.6);
  text('FIGURE STUDY', 110, 212, 46, INK, { spacing: 5, alpha: a, weight: '600' });
  text('30,000 BC  →  2026', 112, 262, 30, ACCENT, { italic: true, alpha: a });
  text('one painting, seventeen ways of making it', 112, 300, 20, MUTED, { italic: true, alpha: a });
  g.globalAlpha = a; g.fillStyle = ACCENT; g.fillRect(112, 330, 60, 2); g.globalAlpha = 1;
  const s = t - INTRO; if (s < 0) return;
  const k = Math.min(NSTY - 1, Math.floor(s / PER)), local = s - k * PER, e = ERAS[k];
  const ca = ease(local / 0.3), dy = (1 - ca) * 18;
  text(String(k + 1).padStart(2, '0'), 106, 640 + dy, 150, ACCENT, { alpha: ca, weight: '300' });
  text(e.name.toUpperCase(), 112, 712 + dy, 40, INK, { spacing: 6, alpha: ca, weight: '600' });
  text(e.medium, 112, 756 + dy, 24, MUTED, { italic: true, alpha: ca });
  text(e.date, 112, 792 + dy, 24, INK, { alpha: ca });
}
function drawTimeline(t) {
  const x0 = PX, x1 = PX + PW, y = 912, s = t - INTRO, a = ease((t - 0.3) / 0.6);
  g.globalAlpha = a; g.strokeStyle = 'rgba(43,39,35,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  const pos = k => x0 + (x1 - x0) * (k / (NSTY - 1));
  const kf = s < 0 ? -0.6 : Math.min(NSTY - 1, Math.floor(s / PER) - 1 + ease((s % PER) / (PER * 0.14)));
  for (let k = 0; k < NSTY; k++) { const done = k <= kf + 0.001; g.fillStyle = done ? ACCENT : 'rgba(43,39,35,0.35)'; g.beginPath(); g.arc(pos(k), y, done ? 4.5 : 3, 0, 6.29); g.fill(); }
  if (s >= 0) { g.strokeStyle = ACCENT; g.lineWidth = 2; g.beginPath(); g.arc(pos(Math.max(0, kf)), y, 10, 0, 6.29); g.stroke(); }
  text('30,000 BC', x0, y + 40, 18, MUTED, { italic: true }); text('2026', x1, y + 40, 18, MUTED, { italic: true, align: 'right' });
  g.globalAlpha = 1;
}
function drawThumbs(t) {
  const s = t - INTRO, x0 = 1500, y0 = 150, tw = 100, thh = 86, gap = 12;
  for (let k = 0; k < NSTY; k++) {
    const cx = x0 + (k % 3) * (tw + gap), cy = y0 + Math.floor(k / 3) * (thh + gap);
    g.strokeStyle = 'rgba(43,39,35,0.15)'; g.lineWidth = 1; g.strokeRect(cx + 0.5, cy + 0.5, tw - 1, thh - 1);
    const pp = pop((s - k * PER - PER * 0.85) / 0.3); if (pp <= 0) continue;
    g.save(); g.translate(cx + tw / 2, cy + thh / 2); g.scale(pp, pp); g.shadowColor = 'rgba(40,25,10,0.25)'; g.shadowBlur = 8; g.shadowOffsetY = 3; g.drawImage(THUMBS[k], -tw / 2, -thh / 2); g.restore();
  }
}
function drawOutro(t, a) {
  g.globalAlpha = a; g.drawImage(PAPER, 0, 0); g.globalAlpha = 1;
  const s = t - (INTRO + NSTY * PER);
  text('FIGURE STUDY', VW / 2, 150, 60, INK, { spacing: 10, align: 'center', weight: '600', alpha: a });
  text('30,000 BC  →  2026', VW / 2, 202, 30, ACCENT, { italic: true, align: 'center', alpha: a });
  const cols = 6, tw = 232, thh = 200, gap = 22, gy = 244;
  for (let k = 0; k < NSTY; k++) {
    const pp = pop((s - 0.15 - k * 0.05) / 0.45) * a; if (pp <= 0) continue;
    const row = Math.floor(k / cols), inRow = row < 2 ? cols : NSTY - 2 * cols, rowX = (VW - (inRow * tw + (inRow - 1) * gap)) / 2;
    const cx = rowX + (k % cols) * (tw + gap), cy = gy + row * (thh + gap + 28);
    g.save(); g.translate(cx + tw / 2, cy + thh / 2); g.scale(pp, pp); g.shadowColor = 'rgba(40,25,10,0.25)'; g.shadowBlur = 16; g.shadowOffsetY = 6; g.drawImage(BIG[k], -tw / 2, -thh / 2); g.restore();
    text(String(k + 1).padStart(2, '0') + '  ' + ERAS[k].name.toUpperCase(), cx, cy + thh + 22, 15, INK, { spacing: 2, alpha: Math.min(1, pp), weight: '600' });
  }
  text('every era drawn, animated and scored by code · no images, no samples', VW / 2, VH - 26, 20, MUTED, { italic: true, align: 'center', alpha: a });
}
function frame(t) {
  t = clamp(t, 0, TOTAL - 0.001);
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(PAPER, 0, 0);
  const outroStart = INTRO + NSTY * PER, oa = ease((t - outroStart) / 0.6);
  if (oa < 1) { drawLeft(t); drawPanel(t); drawTimeline(t); drawThumbs(t); }
  if (oa > 0) drawOutro(t, oa);
  if (t > TOTAL - 0.5) { g.fillStyle = `rgba(239,232,220,${(t - (TOTAL - 0.5)) / 0.5})`; g.fillRect(0, 0, VW, VH); }
}

// ------------------------------------------------------------------ run
const params = new URLSearchParams(location.search);
g.fillStyle = '#efe8dc'; g.fillRect(0, 0, VW, VH);
g.fillStyle = '#8c8276'; g.font = `italic 28px ${SERIF}`; g.textAlign = 'center'; g.fillText('making seventeen paintings…', VW / 2, VH / 2);
setTimeout(() => {
  const S = prepareEras(); bake(); initGL(S); prepareStage();
  if (params.has('record')) { window.renderFrame = frame; window.TOTAL = TOTAL; window.renderMusicWav = renderMusicWav; window.ready = true; return; }
  frame(0);
  g.fillStyle = 'rgba(30,26,22,0.55)'; g.fillRect(0, 0, VW, VH);
  g.fillStyle = '#fbf8f2'; g.font = `italic 44px ${SERIF}`; g.textAlign = 'center'; g.fillText('▶  click to play, sound on', VW / 2, VH / 2);
  stage.addEventListener('click', () => {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const start = ac.currentTime + 0.15; buildMusic(ac, start);
    (function loop() { const t = ac.currentTime - start; frame(Math.max(0, t)); if (t < TOTAL) requestAnimationFrame(loop); })();
  }, { once: true });
}, 30);

</script>
