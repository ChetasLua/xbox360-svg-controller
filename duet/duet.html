<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duet</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// DUET — a short film about two musicians falling in love, made entirely in JavaScript:
// silhouettes and sets are bezier paths, the camera, rain, neon and light are code, and the
// score and sound design are synthesised live with Web Audio. No images, video or samples.
// ------------------------------------------------------------------ silhouettes
// Characters are backlit silhouettes with a rim of light. Everything is bezier paths;
// poses are parameters.
const TAU = Math.PI * 2;

// curly hair: a soft mass whose outline is a run of small scallops
function curlMass(c, cx, cy, rx, ry, n, amp, t = 0, a0 = 0, a1 = TAU) {
  const steps = n * 6;
  for (let k = 0; k <= steps; k++) {
    const th = a0 + (a1 - a0) * (k / steps);
    const sc = 1 + amp * Math.pow(Math.abs(Math.sin(th * n / 2 + t * 0.4)), 0.6) + 0.04 * Math.sin(th * 3.1 + 1.7);
    const x = cx + Math.cos(th) * rx * sc, y = cy + Math.sin(th) * ry * sc;
    k ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.closePath();
}

// A head and shoulders in profile facing +x. Origin = centre of the skull,
// unit ≈ 1/100 of head height; shoulders run off the bottom (y≈120).
function profilePath(c) {
  c.beginPath();
  c.moveTo(-4, -50);
  c.bezierCurveTo(10, -51, 17, -40, 18, -26);        // forehead
  c.bezierCurveTo(18.5, -19, 18.5, -16, 18.4, -14);  // brow
  c.bezierCurveTo(19.5, -9, 24, -3, 26.5, 1.5);      // nose
  c.bezierCurveTo(27.5, 3.5, 24, 5.5, 20.5, 5.5);    // under the nose
  c.bezierCurveTo(21.5, 7.5, 22.6, 9.5, 21.8, 11.4); // upper lip
  c.lineTo(20.2, 12.6);                              // lips part
  c.bezierCurveTo(21.6, 13.6, 21.6, 16.6, 19.2, 18.8); // lower lip
  c.bezierCurveTo(17.4, 20.2, 17.6, 22, 18.2, 24.5); // chin dip
  c.bezierCurveTo(19, 30, 15.5, 34, 9, 35);          // chin
  c.bezierCurveTo(4.5, 36, 3, 39, 3.6, 44);          // under the jaw
  c.bezierCurveTo(4.5, 56, 6, 66, 10, 74);           // throat
  c.bezierCurveTo(18, 84, 40, 92, 52, 104);          // collarbone → shoulder
  c.lineTo(56, 130); c.lineTo(-70, 130); c.lineTo(-66, 104);
  c.bezierCurveTo(-48, 90, -24, 84, -18, 66);        // back of the shoulder → nape
  c.bezierCurveTo(-16, 54, -17, 44, -21, 35);
  c.bezierCurveTo(-34, 22, -36, -28, -4, -50);       // back of the skull
  c.closePath();
}
function hairPath(c, style, t = 0) {
  c.beginPath();
  if (style === 'bob') {                             // Mira: a full, angled bob with a fringe
    c.moveTo(19.5, -30);                             // fringe juts over the brow
    c.bezierCurveTo(19, -22, 15, -19.5, 10, -20);
    c.bezierCurveTo(5, -20, 1, -17, 0, -10);
    c.bezierCurveTo(-1, 2, 2, 16, 9, 31);            // cheek line swinging forward to the jaw
    c.lineTo(4, 34);
    c.bezierCurveTo(-10, 32, -30, 31, -50, 27);      // the cut, flicking out past the nape
    c.bezierCurveTo(-48, 20, -47, 14, -47, 8);
    c.bezierCurveTo(-49, -24, -40, -50, -16, -56);   // full crown
    c.bezierCurveTo(4, -60, 18, -48, 19.5, -30);
    c.closePath();
  } else if (style === 'loose') {                    // June, hair down: curls to the shoulders
    curlMass(c, -18, 6, 32, 60, 22, 0.1, t);
    curlMass(c, 2, -40, 18, 14, 9, 0.12, t);
  } else {                                           // June, hair up: a crown of curls
    curlMass(c, -14, -44, 34, 26, 18, 0.12, t);
    curlMass(c, -28, -14, 14, 18, 8, 0.12, t);
  }
}
function drawProfile(c, o) {
  // o: { x, y, s, face: 1|-1, tilt, hair, t, fill, rim, rimOff:[dx,dy], extra(c) }
  const layer = (col, dx, dy) => {
    c.save(); c.translate(o.x, o.y); c.scale(o.s * o.face, o.s); c.rotate(-(o.tilt || 0)); c.translate(dx, dy);
    c.fillStyle = col; profilePath(c); c.fill(); hairPath(c, o.hair, o.t || 0); c.fill(); if (o.extra) o.extra(c, col);
    c.restore();
  };
  if (o.rim) layer(o.rim, 0, 0);
  layer(o.fill || '#0b0809', ...(o.rim ? o.rimOff : [0, 0]));
}

// Full figure, ~100 units tall, feet at the origin, facing the camera.
function arm(c, x, y, a1, a2, w = 3.3) {
  const ex = x + Math.sin(a1) * 15, ey = y + Math.cos(a1) * 15, hx = ex + Math.sin(a1 + a2) * 13.5, hy = ey + Math.cos(a1 + a2) * 13.5;
  c.lineCap = 'round';
  c.lineWidth = w; c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
  c.lineWidth = w * 0.78; c.beginPath(); c.moveTo(ex, ey); c.lineTo(hx, hy); c.stroke();
  c.beginPath(); c.ellipse(hx + Math.sin(a1 + a2) * 1.6, hy + Math.cos(a1 + a2) * 1.6, 1.7, 2.5, -(a1 + a2), 0, TAU); c.fill();
  return [hx, hy];
}
function leg(c, x, y, a1, a2) {
  const kx = x + Math.sin(a1) * 25, ky = y + Math.cos(a1) * 25, fx = kx + Math.sin(a1 + a2) * 24, fy = ky + Math.cos(a1 + a2) * 24;
  c.lineCap = 'round';
  c.lineWidth = 5.4; c.beginPath(); c.moveTo(x, y); c.lineTo(kx, ky); c.stroke();
  c.lineWidth = 3.6; c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx, fy); c.stroke();
  c.beginPath(); c.moveTo(fx - 1.5, fy - 1); c.lineTo(fx + 4, fy + 0.6); c.lineTo(fx - 1.2, fy + 1.2); c.fill();
}
function bodyPath(c, dress) {
  c.beginPath();
  c.moveTo(-2.2, -82.5);
  c.bezierCurveTo(-5, -81.5, -8.5, -81, -9.8, -78.6);      // shoulder slope
  c.bezierCurveTo(-10.6, -77, -10, -74.5, -9.2, -73);      // round of the shoulder → armpit
  c.bezierCurveTo(-9.8, -70.5, -9.6, -67.5, -7.6, -65.5);  // bust
  c.bezierCurveTo(-6, -63.5, -5.6, -61, -6.2, -59);        // waist
  c.bezierCurveTo(-8.4, -56, -9.6, -52, -9.4, -48);        // hip
  if (dress === 'long') { c.bezierCurveTo(-11, -32, -13.5, -14, -15.5, -1); c.lineTo(15.5, -1); c.bezierCurveTo(13.5, -14, 11, -32, 9.4, -48); }
  else { c.bezierCurveTo(-10, -42, -11, -38, -11.5, -34); c.lineTo(11.5, -34); c.bezierCurveTo(11, -38, 10, -42, 9.4, -48); }
  c.bezierCurveTo(9.6, -52, 8.4, -56, 6.2, -59);
  c.bezierCurveTo(5.6, -61, 6, -63.5, 7.6, -65.5);
  c.bezierCurveTo(9.6, -67.5, 9.8, -70.5, 9.2, -73);
  c.bezierCurveTo(10, -74.5, 10.6, -77, 9.8, -78.6);
  c.bezierCurveTo(8.5, -81, 5, -81.5, 2.2, -82.5);
  c.closePath();
}
function figurePath(c, f) {
  // f: { hair, dress, armL:[a,b], armR:[a,b], legL, legR, lean, head, t }
  c.save(); c.rotate(f.lean || 0);
  if (f.onlyArmR) { arm(c, 8.6, -77.5, ...f.armR); c.restore(); return; }
  if (f.dress !== 'long') { leg(c, -3.6, -50, ...(f.legL || [0.03, 0])); leg(c, 3.6, -50, ...(f.legR || [-0.03, 0])); }
  else { for (const fx of [-5, 5]) { c.beginPath(); c.moveTo(fx - 2, -1); c.lineTo(fx + 3.5, -0.2); c.lineTo(fx - 1.4, 0.8); c.fill(); } }
  bodyPath(c, f.dress); c.fill();
  c.beginPath(); c.moveTo(-1.9, -88); c.lineTo(-2.2, -82); c.lineTo(2.2, -82); c.lineTo(1.9, -88); c.fill();
  c.save(); c.translate(0, -92.5); c.rotate(f.head || 0);
  c.beginPath(); c.moveTo(0, -7.6); c.bezierCurveTo(4.8, -7.6, 5.8, -3, 5.4, 0.6); c.bezierCurveTo(5, 4.4, 2.6, 7.2, 0, 7.4); c.bezierCurveTo(-2.6, 7.2, -5, 4.4, -5.4, 0.6); c.bezierCurveTo(-5.8, -3, -4.8, -7.6, 0, -7.6); c.fill();
  c.scale(0.15, 0.15); c.translate(4, 4); hairPath(c, f.hair, f.t || 0); c.fill();
  c.restore();
  f._hL = arm(c, -8.6, -77.5, ...(f.armL || [0.22, 0.12]));
  f._hR = arm(c, 8.6, -77.5, ...(f.armR || [-0.22, -0.12]));
  c.restore();
}
function drawFigure(c, x, y, s, f, fill = '#0b0809', rim = null, rimOff = [0, 0]) {
  for (const [col, d] of rim ? [[rim, [0, 0]], [fill, rimOff]] : [[fill, [0, 0]]]) {
    c.save(); c.translate(x + d[0], y + d[1]); c.scale(s * (f.face || 1), s); c.fillStyle = c.strokeStyle = col; figurePath(c, f); c.restore();
  }
}

// A hand resting palm-down, fingers toward +x, wrist running off to -x.
function handPath(c, spread = 0, pinky = 0) {
  c.beginPath();
  c.moveTo(-160, -20); c.lineTo(-40, -22);                 // forearm
  c.bezierCurveTo(-14, -26, 6, -24, 12, -21);              // back of the hand
  c.lineTo(14, 22); c.bezierCurveTo(2, 26, -20, 25, -40, 21); c.lineTo(-160, 22); c.closePath();
  const fingers = [[-15, 44, 7], [-4.5, 52, 7.4], [6, 49, 7.2], [16.5, 38, 6.2]];
  fingers.forEach(([y, len, w], k) => {
    const a = (k - 1.5) * 0.07 * spread + (k === 3 ? pinky * 0.42 : 0), L = len + (k === 3 ? pinky * 6 : 0);
    const bx = 9, ex = bx + Math.cos(a) * L, ey = y + Math.sin(a) * L, nx = -Math.sin(a), ny = Math.cos(a);
    c.moveTo(bx - nx * w, y - ny * w); c.lineTo(ex - nx * w * 0.85, ey - ny * w * 0.85);
    c.arc(ex, ey, w * 0.85, a - Math.PI / 2, a + Math.PI / 2); c.lineTo(bx + nx * w, y + ny * w); c.closePath();
  });
  c.moveTo(-26, -20); c.bezierCurveTo(-14, -34, 2, -40, 16, -40);            // thumb
  c.arc(16, -34.5, 5.5, -Math.PI / 2, Math.PI / 2); c.bezierCurveTo(4, -30, -6, -24, -10, -18); c.closePath();
}

// ------------------------------------------------------------------ the film
const W = 1920, H = 1080, BAR_H = 132;                     // 2.39:1 letterbox
const TOTAL = 42.5;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let seed = 4242;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeO = t => 1 - Math.pow(1 - clamp(t), 3);
const hash = (a, b = 0) => { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function off(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const INK = '#0b0809';

// soft bokeh field, pre-rendered
function bokeh(cols, n, rmin, rmax, blur, seedK) {
  const c = off(), x = c.getContext('2d'); x.filter = `blur(${blur}px)`; x.globalCompositeOperation = 'lighter';
  for (let k = 0; k < n; k++) {
    const px = hash(k, seedK) * W, py = hash(k, seedK + 1) * H * 0.9, r = lerp(rmin, rmax, hash(k, seedK + 2)), col = cols[k % cols.length];
    const gr = x.createRadialGradient(px, py, 0, px, py, r); gr.addColorStop(0, col.replace('A', '0.55')); gr.addColorStop(0.7, col.replace('A', '0.35')); gr.addColorStop(1, col.replace('A', '0'));
    x.fillStyle = gr; x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  return c;
}
// drifting haze, pre-rendered (value noise, low res, scaled up)
function haze(col, a, sk) {
  const w = 240, h = 135, c = off(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
  const vn = (px, py) => { const xi = Math.floor(px), yi = Math.floor(py), xf = px - xi, yf = py - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const h2 = (i, j) => hash(i + sk * 131, j); const a0 = h2(xi, yi), b0 = h2(xi + 1, yi), c0 = h2(xi, yi + 1), d0 = h2(xi + 1, yi + 1); return a0 + (b0 - a0) * u + (c0 - a0) * v + (a0 - b0 - c0 + d0) * u * v; };
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    let s = 0, am = 0.5, f = 1 / 28; for (let o = 0; o < 4; o++) { s += am * vn(xx * f, y * f); am *= 0.5; f *= 2; }
    const v = clamp((s - 0.35) * 2.2); const i = (y * w + xx) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = v * a * 255;
  }
  x.putImageData(img, 0, 0);
  const big = off(W * 1.4, H * 1.4), bx = big.getContext('2d'); bx.imageSmoothingQuality = 'high'; bx.drawImage(c, 0, 0, big.width, big.height); return big;
}
function note(x, y, s, col, a, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha = a; g.fillStyle = col; g.strokeStyle = col;
  g.shadowColor = col; g.shadowBlur = 18;
  g.beginPath(); g.ellipse(0, 0, 7, 5, -0.4, 0, TAU); g.fill(); g.lineWidth = 2.2; g.beginPath(); g.moveTo(6, -2); g.lineTo(6, -26); g.quadraticCurveTo(14, -20, 16, -12); g.stroke();
  g.restore(); g.globalAlpha = 1; g.shadowBlur = 0;
}
function rain(n, a, len, wind, t, sk, area = [0, 0, W, H]) {
  g.strokeStyle = `rgba(200,220,255,${a})`; g.lineWidth = 1.4; g.beginPath();
  for (let k = 0; k < n; k++) {
    const sp = 1400 + 700 * hash(k, sk), x0 = area[0] + hash(k, sk + 1) * area[2], y = area[1] + ((hash(k, sk + 2) * area[3] + t * sp) % area[3]);
    const x = x0 + wind * (y - area[1]) / area[3]; g.moveTo(x, y); g.lineTo(x + wind * 0.04, y + len * (0.6 + 0.6 * hash(k, sk + 3)));
  }
  g.stroke();
}

let ASSETS = null;
function prepare() {
  ASSETS = {
    barHaze: haze([255, 170, 120], 0.22, 1), barBokeh: bokeh(['rgba(255,170,90,A)', 'rgba(255,120,80,A)', 'rgba(255,210,140,A)'], 40, 10, 46, 6, 10),
    handBokeh: bokeh(['rgba(255,170,90,A)', 'rgba(90,200,220,A)', 'rgba(255,110,150,A)'], 34, 40, 120, 18, 20),
    kissBokeh: bokeh(['rgba(255,60,150,A)', 'rgba(60,220,255,A)', 'rgba(255,190,120,A)'], 40, 30, 110, 16, 30),
    cityBokeh: bokeh(['rgba(255,190,110,A)', 'rgba(255,90,140,A)', 'rgba(110,190,255,A)'], 70, 6, 28, 5, 40),
    winBokeh: bokeh(['rgba(255,190,110,A)', 'rgba(255,120,140,A)', 'rgba(120,180,255,A)'], 60, 12, 40, 9, 50),
    city: cityScape(), dust: null,
  };
}
function cityScape() {
  const c = off(), x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#070b1c'); sky.addColorStop(0.6, '#16163a'); sky.addColorStop(1, '#2a1838'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  let bx = -40;
  while (bx < W) {
    const bw = 120 + hash(bx | 0, 2) * 200, bh = 260 + hash(bx | 0, 3) * 380, top = 760 - bh;
    x.fillStyle = '#0a0a16'; x.fillRect(bx, top, bw, bh);
    for (let wy = top + 24; wy < 730; wy += 34) for (let wx = bx + 16; wx < bx + bw - 22; wx += 30) {
      const on = hash(wx | 0, wy | 0) > 0.7; if (!on) continue;
      const lv = 0.25 + 0.45 * hash((wx | 0) + 3, wy | 0); x.fillStyle = hash(wx | 0, (wy | 0) + 7) > 0.8 ? `rgba(140,190,255,${lv})` : `rgba(255,196,120,${lv})`; x.fillRect(wx, wy, 14, 18);
    }
    bx += bw + 8;
  }
  return c;
}

// ------------------------------------------------------------------ scene 1: last set
function sceneBar(u) {
  const push = 1 + 0.06 * (u / 8);
  g.save(); g.translate(W / 2, H / 2); g.scale(push, push); g.translate(-W / 2, -H / 2);
  const bg = g.createRadialGradient(1150, 380, 60, 1000, 540, 1100); bg.addColorStop(0, '#5a1f2c'); bg.addColorStop(0.5, '#26101a'); bg.addColorStop(1, '#0c0508'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.8; g.drawImage(ASSETS.barBokeh, 0, -120); g.globalAlpha = 1;
  // spotlight on June
  const jx = 1190;
  g.save(); g.globalCompositeOperation = 'lighter';
  const sp = g.createLinearGradient(0, 0, 0, 950); sp.addColorStop(0, 'rgba(255,214,150,0.32)'); sp.addColorStop(1, 'rgba(255,190,120,0.05)');
  g.fillStyle = sp; g.beginPath(); g.moveTo(jx - 40, 0); g.lineTo(jx + 40, 0); g.lineTo(jx + 260, 950); g.lineTo(jx - 260, 950); g.fill();
  const pool = g.createRadialGradient(jx, 935, 10, jx, 935, 300); pool.addColorStop(0, 'rgba(255,200,130,0.45)'); pool.addColorStop(1, 'rgba(255,200,130,0)'); g.fillStyle = pool; g.fillRect(jx - 320, 860, 640, 160);
  g.restore();
  // stage
  g.fillStyle = '#140a0d'; g.fillRect(0, 930, W, 200);
  // grand piano and Mira
  const beat = (u / 0.75) % 1, hop = Math.pow(1 - beat, 4);
  const lean = 0.03 * Math.sin(u * 2.4);
  drawFigure(g, 300, 1046, 5.4, { hair: 'bob', dress: 'short', head: 0.1 + (u > 5.2 ? 0.16 * ease((u - 5.2) / 0.8) : 0), lean: 0.06 + lean, armL: [1.05 + 0.08 * hop, 0.25], armR: [0.95 - 0.08 * hop, 0.35], legL: [1.45, -1.4], legR: [1.4, -1.4], face: 1 }, INK, '#ff5c8a', [3, 0]);
  grandPiano(560, 930, 1.0);
  // June at the microphone
  const sway = 0.025 * Math.sin(u * 2.1), turn = u > 5.4 ? -0.1 * ease((u - 5.4) / 0.8) : 0;
  g.strokeStyle = INK; g.lineWidth = 6; g.beginPath(); g.moveTo(jx - 70, 930); g.lineTo(jx - 70, 420); g.lineTo(jx - 54, 418); g.stroke();
  g.fillStyle = INK; g.beginPath(); g.ellipse(jx - 46, 414, 10, 16, -0.5, 0, TAU); g.fill();
  drawFigure(g, jx, 940, 5.6, { hair: 'puff', dress: 'long', lean: sway, head: turn + 0.04 * Math.sin(u * 1.6), armL: [-2.25, -0.9], armR: [-0.2, -0.25], t: u }, INK, '#ffc070', [-3, 1]);
  // notes drifting from piano to June
  for (let k = 0; k < 9; k++) {
    const ph = (u * 0.32 + k / 9) % 1, x = lerp(560, 1120, ph), y = 560 - Math.sin(ph * Math.PI) * 180 + Math.sin(ph * 9 + k) * 18;
    note(x, y, 0.9 + 0.4 * hash(k, 3), k % 2 ? '#ffd27a' : '#ff9ab8', Math.sin(ph * Math.PI) * 0.9 * clamp(u / 1.2), Math.sin(ph * 6) * 0.3);
  }
  // the glance: a thread of light between them
  if (u > 5.6) { const a = Math.sin(clamp((u - 5.6) / 2.2) * Math.PI) * 0.7; g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(255,214,150,${a})`; g.lineWidth = 2; g.shadowColor = '#ffcf88'; g.shadowBlur = 20;
    g.beginPath(); g.moveTo(640, 470); g.quadraticCurveTo(900, 330, 1170, 440); g.stroke(); g.restore(); }
  // smoke
  g.globalAlpha = 0.9; g.drawImage(ASSETS.barHaze, -200 + u * 14, -150); g.globalAlpha = 1;
  // audience in the foreground
  for (let k = 0; k < 7; k++) {

  [28.8, 29.7, 'JUNE', '…off.', '#ffc070'],
  [30.0, 31.3, '', '[soft laughter in the dark]', '#bfb4ad'],
  [32.6, 34.4, 'MIRA', 'I wrote you a song last night.', '#ff7fa6'],
  [34.7, 36.6, 'JUNE', 'You were a little busy last night.', '#ffc070'],
  [36.9, 38.4, 'MIRA', '…second verse.', '#ff7fa6'],
];
let GRAIN = null;
function frame(t) {
  t = clamp(t, 0, TOTAL - 0.001);
  g.setTransform(1, 0, 0, 1, 0, 0);
  let si = SCENES.findIndex(([a, b]) => t >= a && t < b); if (si < 0) si = SCENES.length - 1;
  const [a, b, fn] = SCENES[si];
  fn(t - a);
  const fadeIn = clamp((t - a) / 0.45), fadeOut = clamp((b - t) / 0.45), hard = (si === 4);            // the lamp is a hard cut
  const dip = Math.min(si === 0 ? clamp(t / 1.0) : fadeIn, hard ? 1 : fadeOut, si === SCENES.length - 1 ? 1 : 1);
  if (dip < 1) { g.fillStyle = `rgba(0,0,0,${1 - dip})`; g.fillRect(0, 0, W, H); }
  // grain + vignette
  if (!GRAIN) { GRAIN = []; for (let k = 0; k < 4; k++) { const c = off(480, 270), x = c.getContext('2d'), im = x.createImageData(480, 270); for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 22; } x.putImageData(im, 0, 0); GRAIN.push(c); } }
  g.globalCompositeOperation = 'overlay'; g.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, W, H); g.globalCompositeOperation = 'source-over';
  const vg = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1150); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // letterbox + subtitles
  g.fillStyle = '#000'; g.fillRect(0, 0, W, BAR_H); g.fillRect(0, H - BAR_H, W, BAR_H);
  for (const [s0, s1, who, line, col] of LINES) {
    if (t < s0 || t > s1) continue;
    const al = Math.min(clamp((t - s0) / 0.2), clamp((s1 - t) / 0.2));
    g.globalAlpha = al; g.textAlign = 'center';
    g.font = 'italic 40px "DejaVu Serif", Georgia, serif'; g.fillStyle = '#f4ece4';
    const txt = who ? line : line, w = g.measureText(txt).width;
    g.fillText(txt, W / 2 + (who ? 40 : 0), H - BAR_H / 2 + 14);
    if (who) { g.font = '600 22px "DejaVu Sans", sans-serif'; g.letterSpacing = '4px'; g.fillStyle = col; g.textAlign = 'right'; g.fillText(who, W / 2 + 40 - w / 2 - 22, H - BAR_H / 2 + 10); g.letterSpacing = '0px'; }
    g.globalAlpha = 1;
  }
}

// ------------------------------------------------------------------ score & sound design
// A slow neo-soul ballad (80 BPM, Dm9 – G13 – Cmaj9 – A7) that follows the film: a live trio
// in the bar, a lone piano after hours, strings in the rain, the same song on vinyl behind
// a door, a guitar in the morning. Every sound is synthesised; nothing is sampled.
const SBEAT = 0.75, SBAR = 3.0;
const smtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SPROG = [[50, 53, 57, 60, 64], [43, 53, 57, 59, 64], [48, 52, 55, 59, 62], [45, 49, 55, 58, 61]];   // Dm9 G13 Cmaj9 A7(b9-ish)
const SMEL = [[0, 69, 2], [2, 72, 1], [3, 74, 1], [4, 76, 3], [7, 74, 1], [8, 72, 2], [10, 69, 2], [12, 67, 2], [14, 69, 2]];   // two bars, 8ths

function buildScore(ac, t0 = 0) {
  const sr = ac.sampleRate;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(ac.destination);
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(comp);
  const rev = ac.createConvolver(), revG = ac.createGain(); revG.gain.value = 0.35; rev.connect(revG); revG.connect(master);
  { const len = Math.floor(sr * 3.2), b = ac.createBuffer(2, len, sr); for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); let s = 31 + ch; for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; d[i] = ((s / 2147483647) * 2 - 1) * Math.pow(1 - i / len, 2.6); } } rev.buffer = b; }
  // the music bus can be muffled (behind a door, on vinyl); the rain bus can hush (the kiss)
  const musicF = ac.createBiquadFilter(); musicF.type = 'lowpass'; musicF.frequency.value = 18000; musicF.connect(master);
  const rainF = ac.createBiquadFilter(); rainF.type = 'lowpass'; rainF.frequency.value = 9000; rainF.connect(master);
  const T = x => t0 + x;
  let rs = 99; const rand = () => ((rs = (rs * 16807) % 2147483647) / 2147483647);
  musicF.frequency.setValueAtTime(18000, T(25.0)); musicF.frequency.linearRampToValueAtTime(2200, T(25.3));            // on the record
  musicF.frequency.setValueAtTime(2200, T(29.65)); musicF.frequency.linearRampToValueAtTime(650, T(29.9));              // lights out
  musicF.frequency.setValueAtTime(650, T(31.6)); musicF.frequency.linearRampToValueAtTime(18000, T(32.2));              // morning
  rainF.frequency.setValueAtTime(9000, T(22.6)); rainF.frequency.exponentialRampToValueAtTime(900, T(23.3)); rainF.frequency.exponentialRampToValueAtTime(9000, T(24.6));
  const NOISE = (() => { const b = ac.createBuffer(1, sr * 2, sr), d = b.getChannelData(0); let s = 7; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; } return b; })();

    const gn = ac.createGain(); env(gn, t, a, d, s, r, dur, gain); node.connect(gn);
    let out = gn; if (trem) { const tg = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = tremRate; lg.gain.value = trem; tg.gain.value = 1 - trem; l.connect(lg); lg.connect(tg.gain); gn.connect(tg); out = tg; l.start(t); l.stop(t + dur + r + 0.2); }

    const { bright = 0.4, gain = 0.2, pan = 0, wet = 0.3, to = musicF } = o, key = Math.round(f * 10) + '|' + bright;

  }
  function noise(t, dur, o = {}) {
    const { type = 'highpass', f = 6000, q = 0.7, gain = 0.1, a = 0.002, decay = 0.05, pan = 0, wet = 0.1, to = master, f2 = 0, hold = 0 } = o;
    const src = ac.createBufferSource(); src.buffer = NOISE; src.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
    const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(gain, t + a); if (hold) gn.gain.setValueAtTime(gain, t + hold); gn.gain.setTargetAtTime(0.0001, t + Math.max(a, hold), decay);

  const rhodes = (t, f, dur, g = 0.05, pan = 0) => { tone(t, f, dur, { gain: g, a: 0.004, d: 0.8, s: 0.4, r: 0.5, trem: 0.25, tremRate: 4.2, pan, wet: 0.35 }); tone(t, f * 2, dur * 0.5, { gain: g * 0.25, a: 0.002, d: 0.3, s: 0.1, r: 0.3, pan }); };
  const piano = (t, f, dur, g = 0.1, pan = 0, to = musicF) => { for (const [m, a] of [[1, 1], [2, 0.4], [3, 0.18], [4, 0.08]]) tone(t, f * m, dur, { gain: g * a, a: 0.003, d: 0.7 / m + 0.3, s: 0.12, r: 0.4, pan, wet: 0.35, detune: (m - 1) * 3, to }); };
  const vocal = (t, f, dur, g = 0.09, vowel = 'oo') => {          // a hummed voice: saw through two formants
    const osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = f;
    const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.2; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(osc.frequency);
    const [f1, f2] = vowel === 'oo' ? [330, 820] : [700, 1150], gn = ac.createGain(); env(gn, t, 0.08, 0.3, 0.85, 0.35, dur, g);
    for (const [ff, qq, gg] of [[f1, 5, 1], [f2, 7, 0.55]]) { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = qq; const fg = ac.createGain(); fg.gain.value = gg; osc.connect(bp); bp.connect(fg); fg.connect(gn); }
    gn.connect(bus(musicF, 0.05, 0.45)); osc.start(t); l.start(t); osc.stop(t + dur + 0.6); l.stop(t + dur + 0.6);
  };
  const brush = (t, g = 0.06) => noise(t, 0.12, { type: 'bandpass', f: 3500, gain: g, decay: 0.06, pan: 0.25, to: musicF });
  const ride = (t, g = 0.03) => noise(t, 0.4, { f: 7500, gain: g, decay: 0.16, pan: 0.35, to: musicF });
  const kickS = (t, g = 0.5, to = musicF) => { const o = ac.createOscillator(), gg = ac.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.1); gg.gain.setValueAtTime(g, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.connect(gg); gg.connect(bus(to, 0, 0.05)); o.start(t); o.stop(t + 0.4); };
  const band = (start, bars, opts = {}) => {                    // the song itself, bar by bar
    const { voice = true, drums = true, bass = true, keys = true, mel = false, melInst = 'piano' } = opts;
    for (let b = 0; b < bars; b++) {
      const t = start + b * SBAR, ch = SPROG[b % 4];
      if (keys) { [0, 1.5, 2.5].forEach((bt, k) => ch.slice(1).forEach(m => rhodes(t + bt * SBEAT, smtof(m), k === 0 ? SBEAT * 1.4 : SBEAT * 0.8, 0.028, -0.15))); }
      if (bass) { [0, 2, 3.5].forEach((bt, k) => pluck(t + bt * SBEAT, smtof(ch[0] - 12 + (k === 2 ? 7 : 0)), SBEAT * 1.6, { bright: 0.22, gain: 0.32, pan: -0.05 })); }
      if (drums) { kickS(t, 0.32); kickS(t + 2.5 * SBEAT, 0.22); [1, 3].forEach(bt => brush(t + bt * SBEAT, 0.07)); for (let s = 0; s < 4; s++) { ride(t + s * SBEAT); ride(t + (s + 0.66) * SBEAT, 0.018); } }
      if (voice || mel) { SMEL.filter(([s]) => Math.floor(s / 8) === b % 2).forEach(([s, m, l]) => { const tt = t + (s % 8) * SBEAT / 2, dur = l * SBEAT / 2 * 0.95;

    }
  };

  // ---- scene 1, the bar: room tone, the trio and June's voice, then applause
  noise(T(0), 8, { type: 'bandpass', f: 600, q: 0.6, gain: 0.025, a: 1.2, hold: 6.4, decay: 0.5, wet: 0.3 });
  [2.1, 4.4, 6.2].forEach((x, k) => tone(T(x), 2600 + k * 340, 0.3, { gain: 0.012, a: 0.001, d: 0.25, s: 0, r: 0.2, pan: (k - 1) * 0.6, to: master, wet: 0.4 }));
  band(T(0), 3, { voice: true });
  for (let k = 0; k < 60; k++) noise(T(7.4 + rand() * 0.9), 0.04, { type: 'bandpass', f: 1800 + 1200 * rand(), q: 1.5, gain: 0.03, decay: 0.02, pan: rand() * 1.6 - 0.8, wet: 0.4 });
  // ---- scene 2, after hours: lid set down, the bridge alone on piano, a heartbeat
  noise(T(8.15), 0.1, { type: 'lowpass', f: 400, gain: 0.25, decay: 0.05, wet: 0.4 });
  [[8.6, 64], [9.35, 67], [10.1, 69], [11.2, 72], [11.95, 71], [12.7, 67], [13.6, 69]].forEach(([x, m]) => piano(T(x), smtof(m), 1.4, 0.08, 0.1));
  [[8.6, 50], [11.2, 48], [13.6, 45]].forEach(([x, m]) => piano(T(x), smtof(m), 2.5, 0.07, -0.15));
  for (let k = 0; k < 6; k++) { const x = 12.4 + k * 0.62; kickS(T(x), 0.45, master); kickS(T(x + 0.22), 0.3, master); }
  // ---- scene 3, rain: footsteps, thunder far off, strings swelling to the kiss
  noise(T(14.7), 10, { type: 'bandpass', f: 2800, q: 0.4, gain: 0.11, a: 1.0, hold: 8.8, decay: 0.6, to: rainF, wet: 0.2 });
  noise(T(14.7), 10, { type: 'highpass', f: 7000, gain: 0.04, a: 1.0, hold: 8.8, decay: 0.6, to: rainF, pan: 0.3 });
  noise(T(15.6), 2.2, { type: 'lowpass', f: 160, gain: 0.25, a: 0.4, hold: 0.6, decay: 0.8, wet: 0.5 });
  for (let k = 0; k < 10; k++) { const x = 15.0 + k * 0.36; noise(T(x), 0.04, { type: 'bandpass', f: 1500 + (k % 2) * 400, q: 2, gain: 0.07, decay: 0.03, pan: -0.2 + k * 0.04, to: rainF }); }
  noise(T(19.3), 0.3, { type: 'bandpass', f: 900, q: 1, gain: 0.12, decay: 0.12, to: rainF, wet: 0.3 });
  const pad = (start, dur, chord, g) => chord.forEach(m => [-7, 0, 6].forEach(dt => tone(T(start), smtof(m + 12), dur, { type: 'sawtooth', cutoff: 1500, detune: dt, gain: g, a: dur * 0.5, s: 1, r: 1.0, wet: 0.6 })));
  pad(16.5, 3.0, SPROG[0].slice(1), 0.012); pad(19.5, 3.0, SPROG[1].slice(1), 0.016);
  pad(22.6, 2.4, [62, 65, 69, 72, 76], 0.026);                                          // the kiss
  piano(T(22.6), smtof(74), 2.4, 0.12, 0); piano(T(22.6), smtof(50), 3, 0.1, -0.2); tone(T(22.6), smtof(38), 2.6, { gain: 0.2, a: 0.3, s: 1, r: 0.8 });
  // ---- scene 4, the record: needle, crackle, the song again behind the door, the lamp
  noise(T(25.02), 0.08, { type: 'lowpass', f: 300, gain: 0.35, decay: 0.03 });
  { const n = Math.floor(sr * 7.2), b = ac.createBuffer(1, n, sr), d = b.getChannelData(0); let s = 11; for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; const r = s / 2147483647; d[i] = r > 0.9992 ? (r - 0.9996) * 800 : (r - 0.5) * 0.008; }
    const src = ac.createBufferSource(); src.buffer = b; const gn = ac.createGain(); gn.gain.value = 0.4; src.connect(gn); gn.connect(master); src.start(T(25.05)); }
  band(T(25.2), 3, { voice: true, drums: true });
  noise(T(25.0), 7, { type: 'bandpass', f: 1800, q: 0.5, gain: 0.03, a: 0.5, hold: 6, decay: 0.5, to: rainF, pan: 0.5 });
  noise(T(29.62), 0.02, { type: 'highpass', f: 2500, gain: 0.3, decay: 0.008 }); noise(T(29.66), 0.03, { type: 'bandpass', f: 1200, gain: 0.15, decay: 0.01 });
  // ---- scene 5, morning: birds, a guitar, the song resolved
  for (let k = 0; k < 14; k++) { const x = 31.8 + k * 0.55 + (k % 3) * 0.13, f = 2600 + 900 * ((k * 7) % 5); const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(f, T(x)); o.frequency.exponentialRampToValueAtTime(f * 1.4, T(x + 0.07)); o.frequency.exponentialRampToValueAtTime(f * 0.9, T(x + 0.13));
    gn.gain.setValueAtTime(0.0001, T(x)); gn.gain.linearRampToValueAtTime(0.02, T(x + 0.01)); gn.gain.exponentialRampToValueAtTime(0.0001, T(x + 0.15)); o.connect(gn); gn.connect(bus(master, (k % 2 ? 0.6 : -0.6), 0.4)); o.start(T(x)); o.stop(T(x + 0.2)); }
  for (let b = 0; b < 2; b++) { const t = T(32.0 + b * SBAR), ch = SPROG[b % 4]; [0, 1, 2, 3, 4, 3, 2, 1].forEach((k, s) => pluck(t + s * SBEAT / 2, smtof(ch[k % ch.length]), SBEAT, { bright: 0.45, gain: 0.14, pan: -0.25 })); }
  band(T(32.0), 2, { voice: false, drums: false, bass: true, keys: false, mel: true, melInst: 'piano' });
  // final chord into the title
  [50, 57, 60, 64, 65, 69].forEach(m => piano(T(38.4), smtof(m), 4.0, 0.06)); pad(38.4, 4.0, [62, 65, 69, 72], 0.016);
  [0, 0.3, 0.55].forEach((x, k) => tone(T(39.3 + x), smtof(88 + k * 5), 1.6, { gain: 0.03, a: 0.002, d: 1.2, s: 0, r: 1.0, wet: 0.7, to: master }));
}

async function renderScoreWav(seconds) {
  const sr = 44100, ac = new OfflineAudioContext(2, Math.ceil(sr * seconds), sr);
  buildScore(ac, 0);
  const buf = await ac.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
  const wav = new DataView(new ArrayBuffer(44 + n * 4)), str = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
  wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 4, true);
  let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i])); const k = pk > 0.97 ? 0.97 / pk : 1;
  for (let i = 0; i < n; i++) { wav.setInt16(44 + i * 4, Math.max(-32768, Math.min(32767, L[i] * k * 32767)), true); wav.setInt16(46 + i * 4, Math.max(-32768, Math.min(32767, R[i] * k * 32767)), true); }
  const bytes = new Uint8Array(wav.buffer); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

// ------------------------------------------------------------------ run
const params = new URLSearchParams(location.search);
prepare();
if (params.has('record')) { window.renderFrame = frame; window.TOTAL = TOTAL; window.makeWav = () => renderScoreWav(TOTAL + 1); window.ready = true; }
else {
  frame(40.2);
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f4ece4'; g.font = 'italic 46px "DejaVu Serif", Georgia, serif'; g.textAlign = 'center'; g.fillText('▶  click to play, sound on', W / 2, H / 2);
  cv.addEventListener('click', () => {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), start = ac.currentTime + 0.15;
    buildScore(ac, start);
    (function loop() { const t = ac.currentTime - start; frame(Math.max(0, t)); if (t < TOTAL) requestAnimationFrame(loop); })();
  }, { once: true });
}
