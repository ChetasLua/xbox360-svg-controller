// ---------- decode ----------
function decode(b64) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const dv = new DataView(u8.buffer), out = [];
  let o = 0;
  while (o < dv.byteLength) {
    const r = dv.getUint8(o), n = dv.getUint8(o + 4);
    const color = `rgb(${dv.getUint8(o + 1)},${dv.getUint8(o + 2)},${dv.getUint8(o + 3)})`;
    let x = dv.getUint16(o + 5, true), y = dv.getUint16(o + 7, true);
    o += 9;
    const xs = new Float32Array(n), ys = new Float32Array(n), cum = new Float32Array(n);
    xs[0] = x; ys[0] = y;
    for (let i = 1; i < n; i++) {
      x += dv.getInt8(o); y += dv.getInt8(o + 1); o += 2;
      xs[i] = x; ys[i] = y;
      cum[i] = cum[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
    }
    out.push({ r, color, xs, ys, cum, len: cum[n - 1] });
  }
  return out;
}

const WINDOWS = { 26: [0.0, 2.2], 15: [2.2, 3.5], 9: [3.5, 4.7], 6: [4.7, 5.7], 4: [5.7, 6.5], 3: [6.5, 6.85], 2: [6.85, 7.0] };

S.forEach(s => (byR[s.r] = byR[s.r] || []).push(s));
for (const r in byR) {

  list.forEach((s, i) => { s.t0 = a + (b - a) * (i / list.length); });

function pointAt(s, d) {           // point at arc length d along the stroke
  const { xs, ys, cum } = s;
  let i = 1;
  while (i < cum.length - 1 && cum[i] < d) i++;
  const seg = cum[i] - cum[i - 1] || 1, t = Math.min(1, Math.max(0, (d - cum[i - 1]) / seg));
  return [xs[i - 1] + (xs[i] - xs[i - 1]) * t, ys[i - 1] + (ys[i] - ys[i - 1]) * t, i];
}

function drawSpan(c, s, a, b) {    // stroke the stretch [a, b] (arc length) of a stroke
  c.strokeStyle = c.fillStyle = s.color;
  if (s.len === 0) {
    c.beginPath(); c.arc(s.xs[0], s.ys[0], s.r, 0, Math.PI * 2); c.fill();
    return;
  }
  const [x0, y0, i0] = pointAt(s, a), [x1, y1, i1] = pointAt(s, b);
  c.lineWidth = 2 * s.r;
  c.beginPath(); c.moveTo(x0, y0);
  for (let i = i0; i < i1; i++) c.lineTo(s.xs[i], s.ys[i]);
  c.lineTo(x1, y1);
  c.stroke();
}

function drawWhole(c, s, dx = 0, dy = 0) {
  c.strokeStyle = c.fillStyle = s.color;
  if (s.len === 0) {
    c.beginPath(); c.arc(s.xs[0] + dx, s.ys[0] + dy, s.r, 0, Math.PI * 2); c.fill();
    return;
  }
  c.lineWidth = 2 * s.r;
  c.beginPath(); c.moveTo(s.xs[0] + dx, s.ys[0] + dy);
  for (let i = 1; i < s.xs.length; i++) c.lineTo(s.xs[i] + dx, s.ys[i] + dy);
  c.stroke();
}

for (const c of [ctx, pctx]) { c.lineCap = 'round'; c.lineJoin = 'round'; }

// ---------- paint-in state ----------
let next = 0;                      // first stroke not yet started
let active = [];                   // strokes being dragged right now: {s, done}
let settled = false;               // paint canvas holds the final, exact stack
function resetPaint() {
  pctx.fillStyle = BASE; pctx.fillRect(0, 0, W, H);
  next = 0; active = []; settled = false;
}

function advancePaint(t) {
  while (next < N && S[next].t0 <= t) active.push({ s: S[next++], done: 0 });
  const still = [];
  for (const a of active) {
    const s = a.s;
    const k = Math.min(1, (t - s.t0) / s.dur);
    const ease = 1 - Math.pow(1 - k, 2);
    const to = s.len * ease;
    if (s.len === 0) { if (k > 0) drawSpan(pctx, s, 0, 0); continue; }
    if (to > a.done) {
      drawSpan(pctx, s, Math.max(0, a.done - s.r * 0.5), to);
      a.done = to;
    }
    if (k < 1) still.push(a);
  }
  active = still;
}

// ---------- camera, light, finish ----------
function camera(c, t, intro) {
  // slow push-in during the paint, then a gentle breathing drift
  const z0 = intro ? 1.08 - 0.05 * Math.min(1, t / PAINT_DUR) : 1.03;
  const breathe = intro ? 0 : 0.008 * Math.sin(t * 2 * Math.PI / 5.2);
  const z = z0 + breathe;
  const px = intro ? 0 : 6 * Math.sin(t * 0.21), py = intro ? 0 : 4 * Math.cos(t * 0.17);
  c.setTransform(z, 0, 0, z, W / 2 - (W / 2) * z + px, H * 0.55 - (H * 0.55) * z + py);
}

function light(t, strength) {
  if (strength <= 0) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const lx = W * 0.5 + W * 0.32 * Math.sin(t * 0.23), ly = H * 0.38 + H * 0.18 * Math.cos(t * 0.31);
  ctx.globalCompositeOperation = 'soft-light';
  const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 520);
  g.addColorStop(0, `rgba(255,236,200,${0.55 * strength})`);
  g.addColorStop(1, 'rgba(255,236,200,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'multiply';
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.9);
  v.addColorStop(0, 'rgba(255,255,255,1)');
  v.addColorStop(1, `rgba(150,130,140,${strength})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

function frame(t) {
  const intro = t < PAINT_DUR + 0.6;
  if (intro) advancePaint(t);
  else if (!settled) {
    // strokes still dragging their tails can overlap the next layer during the paint-in;
    // lay the whole stack down once, in fitted order, so the result is the exact painting
    resetPaint();
    for (const s of S) drawWhole(pctx, s);
    next = N; settled = true;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H);
  camera(ctx, t, intro);
  ctx.drawImage(paint, 0, 0);

  // alive: fine strokes ride a travelling wave; fades in after the paint-in
  const live = Math.min(1, Math.max(0, (t - PAINT_DUR) / 1.5));
  if (live > 0) {
    ctx.globalAlpha = live;
    for (const s of LIVE) {
      const w = t * 1.15;
      drawWhole(ctx, s, s.amp * Math.sin(w + s.ph), s.amp * 0.8 * Math.cos(w * 0.83 + s.ph2));
    }
    ctx.globalAlpha = 1;
  }
  light(t, 0.35 + 0.65 * live);
}

// ---------- run ----------
const params = new URLSearchParams(location.search);
resetPaint();
if (params.has('t')) {                       // deterministic still at time t (for previews)
  const T = parseFloat(params.get('t'));
  for (let t = 0; t <= Math.min(T, PAINT_DUR + 0.6); t += 1 / 60) advancePaint(t);
  frame(T);
} else if (params.has('record')) {           // deterministic stepping for video capture
  window.renderFrame = t => frame(t);
} else if (params.has('bench')) {            // measure the alive loop's cost per frame
  frame(PAINT_DUR + 2);
  const t0 = performance.now();
  for (let i = 0; i < 30; i++) frame(PAINT_DUR + 2 + i / 30);
  document.title = 'ms/frame ' + ((performance.now() - t0) / 30).toFixed(1);
} else {
  let start = performance.now();
  cv.addEventListener('click', () => { resetPaint(); start = performance.now(); });
  (function loop(now) {
    frame((now - start) / 1000);
    requestAnimationFrame(loop);
  })(start);
}
</script>
</body>
